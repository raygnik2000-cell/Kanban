<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LMS AI Web Design - Tablero Kanban</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Montserrat -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Montserrat', sans-serif; }
    .drag-over { border: 2px dashed #3B82F6; background-color: #EFF6FF; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-slate-900 text-white py-4 px-6 shadow-md flex justify-between items-center">
    <div>
      <h1 class="text-xl font-bold tracking-wide">Tablero Kanban — LMS AI Web Design</h1>
      <p class="text-xs text-slate-400">Gestión e integración continua de contenidos y módulos</p>
    </div>
    <button onclick="cargarTarjetas()" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium py-2 px-4 rounded-lg transition-colors flex items-center gap-2 shadow-sm">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
      Sincronizar
    </button>
  </header>

  <!-- Contenedor Principal Kanban -->
  <main class="flex-1 p-6 overflow-x-auto">
    <div id="kanban-board" class="flex gap-6 min-w-max items-start">
      <!-- Columnas generadas dinámicamente -->
    </div>
  </main>

  <!-- MODAL DE EDICIÓN -->
  <div id="edit-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-xl shadow-xl w-full max-w-lg p-6 relative flex flex-col gap-4">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 class="font-bold text-slate-800 text-lg">Editar Tarjeta</h3>
        <button onclick="cerrarModal()" class="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
      </div>

      <form id="edit-form" onsubmit="guardarEdicion(event)" class="flex flex-col gap-3">
        <input type="hidden" id="edit-id">

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Título</label>
          <input type="text" id="edit-titulo" required class="w-full text-sm border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Descripción</label>
          <textarea id="edit-descripcion" rows="3" class="w-full text-sm border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 focus:outline-none"></textarea>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Responsable</label>
            <input type="text" id="edit-responsable" placeholder="Nombre" class="w-full text-sm border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Estado / Columna</label>
            <select id="edit-estado" class="w-full text-sm border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
              <option value="Backlog">Backlog</option>
              <option value="Asignado a">Asignado a</option>
              <option value="En progreso">En progreso</option>
              <option value="En revisión">En revisión</option>
              <option value="Finalizado">Finalizado</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Fecha Inicio</label>
            <input type="date" id="edit-fechaInicio" class="w-full text-sm border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Fecha Fin</label>
            <input type="date" id="edit-fechaFin" class="w-full text-sm border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">URL de Entregables</label>
          <input type="url" id="edit-url" placeholder="https://..." class="w-full text-sm border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>

        <div class="flex justify-end gap-2 pt-3 border-t mt-2">
          <button type="button" onclick="cerrarModal()" class="px-4 py-2 text-xs font-medium text-slate-600 hover:bg-slate-100 rounded-lg">Cancelar</button>
          <button type="submit" id="btn-guardar" class="px-4 py-2 text-xs font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-lg shadow">Guardar Cambios</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // REEMPLAZA CON TU URL DEL WEB APP TERMINADA EN /exec
    const GAS_API_URL = "REEMPLAZAR_CON_TU_WEB_APP_URL";

    const COLUMNAS = ["Backlog", "Asignado a", "En progreso", "En revisión", "Finalizado"];
    let tarjetasData = [];

    // Inicialización
    document.addEventListener("DOMContentLoaded", () => {
      renderizarColumnas();
      cargarTarjetas();
    });

    function renderizarColumnas() {
      const board = document.getElementById("kanban-board");
      board.innerHTML = "";

      COLUMNAS.forEach(col => {
        const colEl = document.createElement("div");
        colEl.className = "w-80 bg-slate-200/70 rounded-xl p-4 flex flex-col max-h-[85vh] border border-slate-300/60 shadow-sm";
        colEl.dataset.columna = col;

        colEl.innerHTML = `
          <div class="flex items-center justify-between mb-4">
            <h2 class="font-bold text-slate-700 text-sm tracking-wider uppercase">${col}</h2>
            <span class="bg-slate-300 text-slate-700 text-xs font-semibold px-2 py-0.5 rounded-full" id="count-${col.replace(/\s+/g, '-')}">0</span>
          </div>
          <div class="cards-container flex-1 overflow-y-auto flex flex-col gap-3 pr-1" 
               ondragover="handleDragOver(event)" 
               ondragleave="handleDragLeave(event)" 
               ondrop="handleDrop(event, '${col}')">
          </div>
        `;
        board.appendChild(colEl);
      });
    }

    async function cargarTarjetas() {
      try {
        const response = await fetch(GAS_API_URL, {
          method: "GET",
          redirect: "follow"
        });

        const textResult = await response.text();

        try {
          tarjetasData = JSON.parse(textResult);
          if (Array.isArray(tarjetasData)) {
            renderizarTarjetas();
          } else if (tarjetasData.status === "error") {
            alert("Error de Apps Script: " + tarjetasData.message);
          }
        } catch (e) {
          console.error("Respuesta no válida del servidor:", textResult);
          alert("Error de conexión. Verifica los permisos de acceso en Apps Script.");
        }

      } catch (error) {
        console.error("Error al cargar tarjetas:", error);
        alert("Error de red: No se pudo realizar la petición.");
      }
    }

    function renderizarTarjetas() {
      COLUMNAS.forEach(col => {
        const container = document.querySelector(`[data-columna="${col}"] .cards-container`);
        if (container) container.innerHTML = "";
        const counter = document.getElementById(`count-${col.replace(/\s+/g, '-')}`);
        if (counter) counter.innerText = "0";
      });

      tarjetasData.forEach(card => {
        const container = document.querySelector(`[data-columna="${card.estado}"] .cards-container`);
        if (container) {
          container.appendChild(crearElementoTarjeta(card));
        }
      });

      COLUMNAS.forEach(col => {
        const count = tarjetasData.filter(t => t.estado === col).length;
        const counter = document.getElementById(`count-${col.replace(/\s+/g, '-')}`);
        if (counter) counter.innerText = count;
      });
    }

    function crearElementoTarjeta(card) {
      const cardEl = document.createElement("div");
      cardEl.className = "bg-white p-4 rounded-lg shadow-sm border border-slate-200 cursor-grab active:cursor-grabbing hover:shadow-md transition-shadow relative group";
      cardEl.draggable = true;
      cardEl.id = `card-${card.id}`;
      cardEl.ondragstart = (e) => handleDragStart(e, card.id);

      const urlBlock = card.url ? `
        <a href="${card.url}" target="_blank" class="mt-3 inline-flex items-center gap-1 text-xs text-blue-600 hover:text-blue-800 font-medium truncate max-w-full">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
          ${card.url}
        </a>
      ` : '';

      cardEl.innerHTML = `
        <div class="flex justify-between items-start mb-1 pr-6">
          <h3 class="font-semibold text-slate-800 text-sm leading-snug">${card.titulo}</h3>
        </div>

        <!-- Botón de Editar (Ícono de lápiz) -->
        <button onclick="abrirModalEdicion('${card.id}')" title="Editar tarjeta" class="absolute top-3 right-3 text-slate-400 hover:text-blue-600 p-1 rounded hover:bg-slate-100 transition-colors">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
        </button>

        <p class="text-xs text-slate-500 mb-3 leading-relaxed">${card.descripcion || 'Sin descripción'}</p>
        
        <div class="flex items-center justify-between text-[11px] text-slate-500 mb-2">
          <span class="flex items-center gap-1 font-medium bg-slate-100 text-slate-600 px-2 py-0.5 rounded">
            👤 ${card.responsable || 'Sin asignar'}
          </span>
        </div>

        <div class="text-[10px] text-slate-400 flex justify-between border-t border-slate-100 pt-2">
          <span>Inicio: ${card.fechaInicio || 'N/A'}</span>
          <span>Fin: ${card.fechaFin || 'N/A'}</span>
        </div>

        ${urlBlock}
      `;

      return cardEl;
    }

    // LÓGICA DEL MODAL Y EDICIÓN
    function abrirModalEdicion(cardId) {
      const card = tarjetasData.find(t => t.id.toString() === cardId.toString());
      if (!card) return;

      document.getElementById("edit-id").value = card.id;
      document.getElementById("edit-titulo").value = card.titulo || "";
      document.getElementById("edit-descripcion").value = card.descripcion || "";
      document.getElementById("edit-responsable").value = card.responsable || "";
      document.getElementById("edit-estado").value = card.estado || "Backlog";
      document.getElementById("edit-fechaInicio").value = card.fechaInicio || "";
      document.getElementById("edit-fechaFin").value = card.fechaFin || "";
      document.getElementById("edit-url").value = card.url || "";

      document.getElementById("edit-modal").classList.remove("hidden");
    }

    function cerrarModal() {
      document.getElementById("edit-modal").classList.add("hidden");
    }

    async function guardarEdicion(e) {
      e.preventDefault();

      const btn = document.getElementById("btn-guardar");
      btn.innerText = "Guardando...";
      btn.disabled = true;

      const cardData = {
        id: document.getElementById("edit-id").value,
        titulo: document.getElementById("edit-titulo").value,
        descripcion: document.getElementById("edit-descripcion").value,
        responsable: document.getElementById("edit-responsable").value,
        estado: document.getElementById("edit-estado").value,
        fechaInicio: document.getElementById("edit-fechaInicio").value,
        fechaFin: document.getElementById("edit-fechaFin").value,
        url: document.getElementById("edit-url").value
      };

      try {
        const response = await fetch(GAS_API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ accion: "editar", cardData: cardData }),
          redirect: "follow"
        });

        const result = await response.json();

        if (result.status === "success") {
          cerrarModal();
          await cargarTarjetas(); // Recargar datos desde Google Sheets
        } else {
          alert("Error al guardar: " + result.message);
        }
      } catch (error) {
        console.error("Error guardando cambios:", error);
        alert("No se pudo guardar la información.");
      } finally {
        btn.innerText = "Guardar Cambios";
        btn.disabled = false;
      }
    }

    // DRAG & DROP HANDLERS
    function handleDragStart(e, cardId) {
      e.dataTransfer.setData("text/plain", cardId);
      e.dataTransfer.effectAllowed = "move";
    }

    function handleDragOver(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      e.currentTarget.classList.add("drag-over");
    }

    function handleDragLeave(e) {
      e.currentTarget.classList.remove("drag-over");
    }

    async function handleDrop(e, nuevoEstado) {
      e.preventDefault();
      e.currentTarget.classList.remove("drag-over");

      const cardId = e.dataTransfer.getData("text/plain");
      const cardIndex = tarjetasData.findIndex(t => t.id.toString() === cardId.toString());

      if (cardIndex !== -1 && tarjetasData[cardIndex].estado !== nuevoEstado) {
        const estadoAnterior = tarjetasData[cardIndex].estado;
        
        // Cambio optimista en UI
        tarjetasData[cardIndex].estado = nuevoEstado;
        renderizarTarjetas();

        try {
          const response = await fetch(GAS_API_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({
              accion: "mover",
              cardData: { id: cardId, nuevoEstado: nuevoEstado }
            }),
            redirect: "follow"
          });

          const result = await response.json();
          if (result.status !== "success") {
            throw new Error(result.message);
          }
        } catch (error) {
          console.error("Error al mover tarjeta:", error);
          tarjetasData[cardIndex].estado = estadoAnterior;
          renderizarTarjetas();
          alert("No se pudo guardar el cambio de estado en Google Sheets.");
        }
      }
    }
  </script>
</body>
</html>
