<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablero Kanban - LCM visuals</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        /* Personalización de barra de desplazamiento estilo Cyberpunk/Dark */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #06b6d4;
        }
        .kanban-column {
            min-height: 65vh;
        }
        .card.dragging {
            opacity: 0.4;
            transform: scale(0.98);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col font-sans overflow-x-hidden antialiased">

    <!-- Header con estética Neón / Dev -->
    <header class="bg-slate-900/80 backdrop-blur-md border-b border-slate-800 p-4 sticky top-0 z-20 flex justify-between items-center shadow-lg shadow-cyan-950/20">
        <div class="flex items-center gap-3">
            <div class="w-3 h-3 rounded-full bg-cyan-400 animate-pulse shadow-[0_0_10px_#22d3ee]"></div>
            <div>
                <h1 class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
                    LMS AI <span class="text-xs px-2 py-0.5 rounded border border-cyan-500/30 bg-cyan-500/10 text-cyan-400 font-mono">Web Dev</span>
                </h1>
                <p class="text-xs text-slate-400">Tablero de Gestión & Entregables</p>
            </div>
        </div>
        
        <button onclick="document.getElementById('taskModal').classList.remove('hidden')" class="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-semibold text-sm px-4 py-2 rounded-lg transition shadow-lg shadow-cyan-500/20 flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"></path></svg>
            Nueva Tarjeta
        </button>
    </header>

    <!-- Tablero Kanban -->
    <main class="flex-1 overflow-x-auto p-6">
        <div class="flex gap-5 items-start h-full min-w-max" id="board">
            
            <!-- Columna: Backlog -->
            <div class="bg-slate-900/60 border border-slate-800/80 rounded-xl w-80 shrink-0 p-4 flex flex-col backdrop-blur-sm" data-status="Backlog">
                <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-800">
                    <h2 class="font-semibold text-slate-300 text-sm flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-slate-400"></span> Backlog
                    </h2>
                </div>
                <div class="kanban-column space-y-3" id="col-Backlog"></div>
            </div>

            <!-- Columna: Asignado a -->
            <div class="bg-slate-900/60 border border-slate-800/80 rounded-xl w-80 shrink-0 p-4 flex flex-col backdrop-blur-sm" data-status="Asignado a">
                <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-800">
                    <h2 class="font-semibold text-purple-300 text-sm flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-purple-400"></span> Asignado a
                    </h2>
                </div>
                <div class="kanban-column space-y-3" id="col-Asignado a"></div>
            </div>

            <!-- Columna: En progreso -->
            <div class="bg-slate-900/60 border border-slate-800/80 rounded-xl w-80 shrink-0 p-4 flex flex-col backdrop-blur-sm" data-status="En progreso">
                <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-800">
                    <h2 class="font-semibold text-cyan-300 text-sm flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-cyan-400"></span> En progreso
                    </h2>
                </div>
                <div class="kanban-column space-y-3" id="col-En progreso"></div>
            </div>

            <!-- Columna: En revisión (Resaltada por Trigger) -->
            <div class="bg-slate-900/60 border border-amber-500/30 rounded-xl w-80 shrink-0 p-4 flex flex-col backdrop-blur-sm shadow-[0_0_15px_rgba(245,158,11,0.05)]" data-status="En revisión">
                <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-800">
                    <h2 class="font-semibold text-amber-400 text-sm flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-amber-400 animate-ping"></span> En revisión
                    </h2>
                    <span class="text-[10px] bg-amber-500/10 text-amber-400 border border-amber-500/20 px-1.5 py-0.5 rounded font-mono">Notifica Email</span>
                </div>
                <div class="kanban-column space-y-3" id="col-En revisión"></div>
            </div>

            <!-- Columna: Finalizado -->
            <div class="bg-slate-900/60 border border-slate-800/80 rounded-xl w-80 shrink-0 p-4 flex flex-col backdrop-blur-sm" data-status="Finalizado">
                <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-800">
                    <h2 class="font-semibold text-emerald-400 text-sm flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-emerald-400"></span> Finalizado
                    </h2>
                </div>
                <div class="kanban-column space-y-3" id="col-Finalizado"></div>
            </div>

        </div>
    </main>

    <!-- Modal para Nueva Tarjeta (Dark Mode) -->
    <div id="taskModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 w-full max-w-md shadow-2xl">
            <div class="flex justify-between items-center mb-5 border-b border-slate-800 pb-3">
                <h2 class="text-lg font-bold text-white flex items-center gap-2">
                    <span class="text-cyan-400">&gt;_</span> Crear Nueva Tarjeta
                </h2>
                <button onclick="document.getElementById('taskModal').classList.add('hidden')" class="text-slate-400 hover:text-white">✕</button>
            </div>
            
            <form id="taskForm" class="space-y-4">
                <div>
                    <label class="text-xs text-slate-400 font-medium mb-1 block">Título de la tarea</label>
                    <input type="text" id="titulo" placeholder="Ej: Módulo de IA con OpenAI API" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm text-slate-200 focus:outline-none focus:border-cyan-500 transition" required>
                </div>

                <div>
                    <label class="text-xs text-slate-400 font-medium mb-1 block">Descripción detallada</label>
                    <textarea id="descripcion" placeholder="Detalla los entregables..." class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm text-slate-200 focus:outline-none focus:border-cyan-500 transition h-20" required></textarea>
                </div>
                
                <div>
                    <label class="text-xs text-slate-400 font-medium mb-1 block">Responsable</label>
                    <select id="responsable" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm text-slate-200 focus:outline-none focus:border-cyan-500 transition" required>
                        <option value="" disabled selected>Selecciona un miembro...</option>
                        <option value="Miguel">Miguel (Dev)</option>
                    <option value="Cristian">Cristian (Design)</option>
                    <option value="Luis">Luis (AI Prompter)</option>

                    </select>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-xs text-slate-400 font-medium mb-1 block">Fecha Inicio</label>
                        <input type="date" id="fechaInicio" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs text-slate-200 focus:outline-none focus:border-cyan-500 transition" required>
                    </div>
                    <div>
                        <label class="text-xs text-slate-400 font-medium mb-1 block">Fecha Fin</label>
                        <input type="date" id="fechaFin" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs text-slate-200 focus:outline-none focus:border-cyan-500 transition" required>
                    </div>
                </div>
                
                <div>
                    <label class="text-xs text-slate-400 font-medium mb-1 block">URL Entregable / Repo</label>
                    <input type="url" id="url" placeholder="https://github.com/..." class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm text-slate-200 focus:outline-none focus:border-cyan-500 transition">
                </div>
                
                <div class="flex justify-end gap-3 mt-6 pt-3 border-t border-slate-800">
                    <button type="button" onclick="document.getElementById('taskModal').classList.add('hidden')" class="px-4 py-2 text-sm text-slate-400 hover:text-white transition">Cancelar</button>
                    <button type="submit" class="px-4 py-2 bg-cyan-500 hover:bg-cyan-400 text-slate-950 text-sm font-semibold rounded-lg transition shadow-lg shadow-cyan-500/20">Guardar Tarjeta</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
