<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablero Kanban - LCM visuals</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Poppins', sans-serif; 
            background: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
        }
        .kanban-column { min-height: 65vh; }
        .card.dragging { opacity: 0.4; transform: scale(0.96) rotate(-1deg); }
        /* Scrollbar delgada y personalizada */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-x-hidden text-gray-800">

    <!-- Header con estilo Glassmorphism -->
    <header class="bg-indigo-600/95 backdrop-blur-md text-white px-8 py-4 shadow-lg flex justify-between items-center border-b border-indigo-500/30">
        <div class="flex items-center space-x-3">
            <div class="p-2 bg-white/10 rounded-lg backdrop-blur-sm">
                📊
            </div>
            <div>
                <h1 class="text-xl md:text-2xl font-bold tracking-wide">Tablero Kanban - LCM visuals</h1>
                <p class="text-xs text-indigo-200 font-light">Gestión de Tareas y Entregables</p>
            </div>
        </div>
        <button onclick="document.getElementById('taskModal').classList.remove('hidden')" class="bg-white text-indigo-600 hover:bg-indigo-50 px-5 py-2.5 rounded-xl font-semibold shadow-md hover:shadow-lg transition-all duration-200 flex items-center gap-2 active:scale-95">
            <span class="text-lg">+</span> Nueva Tarjeta
        </button>
    </header>

    <!-- Tablero Kanban -->
    <main class="flex-1 overflow-x-auto p-6 md:p-8">
        <div class="flex gap-6 items-start h-full min-w-max pb-4" id="board">
            
            <!-- Columna: Backlog -->
            <div class="bg-slate-200/60 backdrop-blur-sm border border-slate-300/60 rounded-2xl w-80 shrink-0 p-4 flex flex-col shadow-sm" data-status="Backlog">
                <div class="flex justify-between items-center mb-4 px-1">
                    <h2 class="font-bold text-slate-700 flex items-center gap-2 text-sm uppercase tracking-wider">
                        <span class="p-1 bg-slate-300/70 rounded-md text-xs">📌</span> Backlog
                    </h2>
                </div>
                <div class="kanban-column space-y-3" id="col-Backlog"></div>
            </div>

            <!-- Columna: Asignado a -->
            <div class="bg-slate-200/60 backdrop-blur-sm border border-slate-300/60 rounded-2xl w-80 shrink-0 p-4 flex flex-col shadow-sm" data-status="Asignado a">
                <div class="flex justify-between items-center mb-4 px-1">
                    <h2 class="font-bold text-slate-700 flex items-center gap-2 text-sm uppercase tracking-wider">
                        <span class="p-1 bg-slate-300/70 rounded-md text-xs">👤</span> Asignado a
                    </h2>
                </div>
                <div class="kanban-column space-y-3" id="col-Asignado a"></div>
            </div>

            <!-- Columna: En progreso -->
            <div class="bg-blue-100/50 backdrop-blur-sm border border-blue-200/60 rounded-2xl w-80 shrink-0 p-4 flex flex-col shadow-sm" data-status="En progreso">
                <div class="flex justify-between items-center mb-4 px-1">
                    <h2 class="font-bold text-blue-800 flex items-center gap-2 text-sm uppercase tracking-wider">
                        <span class="p-1 bg-blue-200/70 rounded-md text-xs">⚙️</span> En progreso
                    </h2>
                </div>
                <div class="kanban-column space-y-3" id="col-En progreso"></div>
            </div>

            <!-- Columna: En revisión -->
            <div class="bg-amber-100/50 backdrop-blur-sm border border-amber-200/60 rounded-2xl w-80 shrink-0 p-4 flex flex-col shadow-sm" data-status="En revisión">
                <div class="flex justify-between items-center mb-4 px-1">
                    <h2 class="font-bold text-amber-800 flex items-center gap-2 text-sm uppercase tracking-wider">
                        <span class="p-1 bg-amber-200/70 rounded-md text-xs">👀</span> En revisión
                    </h2>
                </div>
                <div class="kanban-column space-y-3" id="col-En revisión"></div>
            </div>

            <!-- Columna: Finalizado -->
            <div class="bg-emerald-100/50 backdrop-blur-sm border border-emerald-200/60 rounded-2xl w-80 shrink-0 p-4 flex flex-col shadow-sm" data-status="Finalizado">
                <div class="flex justify-between items-center mb-4 px-1">
                    <h2 class="font-bold text-emerald-800 flex items-center gap-2 text-sm uppercase tracking-wider">
                        <span class="p-1 bg-emerald-200/70 rounded-md text-xs">✅</span> Finalizado
                    </h2>
                </div>
                <div class="kanban-column space-y-3" id="col-Finalizado"></div>
            </div>

        </div>
    </main>

    <!-- Modal para Nueva Tarjeta -->
    <div id="taskModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl shadow-2xl p-6 w-full max-w-md border border-slate-100 transform transition-all">
            <div class="flex justify-between items-center mb-5 border-b pb-3">
                <h2 class="text-lg font-bold text-slate-800">Crear Nueva Tarjeta</h2>
                <button onclick="document.getElementById('taskModal').classList.add('hidden')" class="text-slate-400 hover:text-slate-600 font-bold p-1">✕</button>
            </div>
            
            <form id="taskForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Título de la tarea</label>
                    <input type="text" id="titulo" placeholder="Ej: Diseñar Wireframes" class="w-full border border-slate-200 rounded-xl p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 transition" required>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Descripción</label>
                    <textarea id="descripcion" placeholder="Describe los detalles principales..." class="w-full border border-slate-200 rounded-xl p-2.5 text-sm h-20 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 transition resize-none" required></textarea>
                </div>
                
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Responsable</label>
                    <select id="responsable" class="w-full border border-slate-200 rounded-xl p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 transition bg-white" required>
                        <option value="" disabled selected>Selecciona un responsable...</option>
                        <option value="Carlos">Carlos (Dev)</option>
                        <option value="Maria">Maria (Design)</option>
                        <option value="Miguel">Miguel (AI Prompter)</option>
                    </select>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Fecha Inicio</label>
                        <input type="date" id="fechaInicio" class="w-full border border-slate-200 rounded-xl p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 transition" required>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Fecha Fin</label>
                        <input type="date" id="fechaFin" class="w-full border border-slate-200 rounded-xl p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 transition" required>
                    </div>
                </div>
                
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Enlace del Entregable (Opcional)</label>
                    <input type="url" id="url" placeholder="https://..." class="w-full border border-slate-200 rounded-xl p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 transition">
                </div>
                
                <div class="flex justify-end gap-3 pt-3 border-t">
                    <button type="button" onclick="document.getElementById('taskModal').classList.add('hidden')" class="px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 rounded-xl transition">Cancelar</button>
                    <button type="submit" class="px-5 py-2 text-sm font-medium bg-indigo-600 text-white rounded-xl hover:bg-indigo-700 shadow-md transition">Crear Tarjeta</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
