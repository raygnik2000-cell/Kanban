<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablero Kanban - LCM visuals</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Space Grotesk', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                }
            }
        }
    </script>
    <style>
        /* Malla dinámica de fondo */
        .cyber-grid {
            background-size: 40px 40px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        }

        /* Scrollbar personalizado tipo Sci-Fi */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #090d16; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 99px; }
        ::-webkit-scrollbar-thumb:hover { background: #6366f1; }

        .kanban-column { min-height: 68vh; }
        .card.dragging { opacity: 0.3; transform: rotate(2deg) scale(0.96); }

        /* Resplandor Neón al pasar la tarjeta */
        .neon-card {
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .neon-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.25);
        }
    </style>
</head>
<body class="bg-[#070a11] text-slate-100 h-screen flex flex-col font-sans cyber-grid overflow-x-hidden antialiased selection:bg-indigo-500 selection:text-white">

    <!-- Header Neón Translucido -->
    <header class="bg-[#0c101d]/80 backdrop-blur-xl border-b border-indigo-500/10 px-6 py-4 sticky top-0 z-20 flex flex-wrap justify-between items-center gap-4">
        
        <!-- Logo y Status -->
        
                    </div>
                </div>
                <span class="absolute -bottom-1 -right-1 w-3.5 h-3.5 bg-emerald-500 border-2 border-[#070a11] rounded-full animate-pulse"></span>
            </div>
            <div>
                <div class="flex items-center gap-2">
                    <h1 class="text-xl font-bold tracking-tight bg-gradient-to-r from-white via-slate-200 to-indigo-300 bg-clip-text text-transparent">Tablero Kanban - LCM visuals</h1>
                    <span class="text-[10px] font-mono bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 px-2 py-0.5 rounded-full">v2.0</span>
                </div>
                <p class="text-xs text-slate-400 font-mono">Tablero Kanban</p>
            </div>
        </div>

        <!-- Métrica Rápida -->
        <div class="hidden md:flex items-center gap-6 bg-[#070a11]/60 border border-slate-800/80 rounded-xl px-4 py-2 font-mono text-xs">
            <div class="flex items-center gap-2">
                <span class="text-slate-500">TOTAL:</span>
                <span id="stat-total" class="font-bold text-indigo-400">0</span>
            </div>
            <div class="w-px h-4 bg-slate-800"></div>
            <div class="flex items-center gap-2">
                <span class="text-slate-500">REVISIÓN:</span>
                <span id="stat-revision" class="font-bold text-amber-400">0</span>
            </div>
            <div class="w-px h-4 bg-slate-800"></div>
            <div class="flex items-center gap-2">
                <span class="text-slate-500">LISTO:</span>
                <span id="stat-done" class="font-bold text-emerald-400">0</span>
            </div>
        </div>

        <!-- Botón Acción Principal -->
        <button onclick="document.getElementById('taskModal').classList.remove('hidden')" class="relative group overflow-hidden rounded-xl p-[1px] font-semibold text-xs transition-all duration-300 active:scale-95">
            <span class="absolute inset-0 bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 group-hover:opacity-100 transition-opacity"></span>
            <span class="relative block px-5 py-2.5 bg-[#0c101d] rounded-[11px] text-white group-hover:bg-transparent transition-colors font-mono flex items-center gap-2">
                <span class="text-indigo-400 font-bold group-hover:text-white">+</span> NUEVA TARJETA
            </span>
        </button>
    </header>

    <!-- Tablero Kanban de Alta Gama -->
    <main class="flex-1 overflow-x-auto p-6">
        <div class="flex gap-6 items-start h-full min-w-max" id="board">
            
            <!-- Columna 1: Backlog -->
            <div class="bg-[#0c101d]/60 border border-slate-800/60 rounded-2xl w-80 shrink-0 p-4 flex flex-col backdrop-blur-md shadow-xl" data-status="Backlog">
                <div class="flex justify-between items-center mb-4 pb-3 border-b border-slate-800/80">
                    <div class="flex items-center gap-2">
                        <div class="w-2.5 h-2.5 rounded-full bg-slate-500 shadow-[0_0_8px_#94a3b8]"></div>
                        <h2 class="font-bold text-slate-300 text-xs tracking-wider uppercase font-mono">01. Backlog</h2>
                    </div>
                </div>
                <div class="kanban-column space-y-3" id="col-Backlog"></div>
            </div>

            <!-- Columna 2: Asignado a -->
            <div class="bg-[#0c101d]/60 border border-slate-800/60 rounded-2xl w-80 shrink-0 p-4 flex flex-col backdrop-blur-md shadow-xl" data-status="Asignado a">
                <div class="flex justify-between items-center mb-4 pb-3 border-b border-slate-800/80">
                    <div class="flex items-center gap-2">
                        <div class="w-2.5 h-2.5 rounded-full bg-purple-500 shadow-[0_0_8px_#a855f7]"></div>
                        <h2 class="font-bold text-purple-300 text-xs tracking-wider uppercase font-mono">02. Asignado</h2>
                    </div>
                </div>
                <div class="kanban-column space-y-3" id="col-Asignado a"></div>
            </div>

            <!-- Columna 3: En progreso -->
            <div class="bg-[#0c101d]/60 border border-indigo-500/20 rounded-2xl w-80 shrink-0 p-4 flex flex-col backdrop-blur-md shadow-[0_0_30px_rgba(99,102,241,0.03)]" data-status="En progreso">
                <div class="flex justify-between items-center mb-4 pb-3 border-b border-indigo-500/20">
                    <div class="flex items-center gap-2">
                        <div class="w-2.5 h-2.5 rounded-full bg-indigo-500 shadow-[0_0_8px_#6366f1] animate-pulse"></div>
                        <h2 class="font-bold text-indigo-300 text-xs tracking-wider uppercase font-mono">03. En Progreso</h2>
                    </div>
                </div>
                <div class="kanban-column space-y-3" id="col-En progreso"></div>
            </div>

            <!-- Columna 4: En revisión (Glow Neón Especial) -->
            <div class="bg-[#0c101d]/80 border border-amber-500/40 rounded-2xl w-80 shrink-0 p-4 flex flex-col backdrop-blur-md shadow-[0_0_20px_rgba(245,158,11,0.08)]" data-status="En revisión">
                <div class="flex justify-between items-center mb-4 pb-3 border-b border-amber-500/30">
                    <div class="flex items-center gap-2">
                        <div class="w-2.5 h-2.5 rounded-full bg-amber-400 shadow-[0_0_8px_#fbbf24] animate-ping"></div>
                        <h2 class="font-bold text-amber-400 text-xs tracking-wider uppercase font-mono">04. En Revisión</h2>
                    </div>
                    <span class="text-[9px] font-mono bg-amber-500/10 text-amber-400 border border-amber-500/30 px-2 py-0.5 rounded-full">EMAIL TRIGGER</span>
                </div>
                <div class="kanban-column space-y-3" id="col-En revisión"></div>
            </div>

            <!-- Columna 5: Finalizado -->
            <div class="bg-[#0c101d]/60 border border-emerald-500/20 rounded-2xl w-80 shrink-0 p-4 flex flex-col backdrop-blur-md shadow-xl" data-status="Finalizado">
                <div class="flex justify-between items-center mb-4 pb-3 border-b border-emerald-500/20">
                    <div class="flex items-center gap-2">
                        <div class="w-2.5 h-2.5 rounded-full bg-emerald-400 shadow-[0_0_8px_#34d399]"></div>
                        <h2 class="font-bold text-emerald-400 text-xs tracking-wider uppercase font-mono">05. Finalizado</h2>
                    </div>
                </div>
                <div class="kanban-column space-y-3" id="col-Finalizado"></div>
            </div>

        </div>
    </main>

    <!-- Modal Modal Sci-Fi para Crear Tarjetas -->
    <div id="taskModal" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden flex items-center justify-center z-50 p-4">
        <div class="bg-[#0c101d] border border-indigo-500/30 rounded-2xl p-6 w-full max-w-md shadow-[0_0_50px_rgba(99,102,241,0.2)]">
            <div class="flex justify-between items-center mb-6 pb-3 border-b border-slate-800">
                <h2 class="text-base font-bold text-white font-mono flex items-center gap-2">
                    <span class="text-indigo-400">&gt;</span> REGISTRAR_NUEVA_TAREA
                </h2>
                <button onclick="document.getElementById('taskModal').classList.add('hidden')" class="text-slate-500 hover:text-white transition font-mono">✕</button>
            </div>
            
            <form id="taskForm" class="space-y-4">
                <div>
                    <label class="text-[11px] font-mono text-slate-400 mb-1 block">TÍTULO DE LA TAREA</label>
                    <input type="text" id="titulo" placeholder="Ej: Implementar Prompting con Claude" class="w-full bg-[#070a11] border border-slate-800 rounded-xl p-3 text-sm text-slate-100 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition font-sans" required>
                </div>

                <div>
                    <label class="text-[11px] font-mono text-slate-400 mb-1 block">DESCRIPCIÓN TÉCNICA</label>
                    <textarea id="descripcion" placeholder="Detalla los objetivos del entregable..." class="w-full bg-[#070a11] border border-slate-800 rounded-xl p-3 text-sm text-slate-100 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition h-20 font-sans" required></textarea>
                </div>
                
                <div>
                    <label class="text-[11px] font-mono text-slate-400 mb-1 block">RESPONSABLE ASIGNADO</label>
                    <select id="responsable" class="w-full bg-[#070a11] border border-slate-800 rounded-xl p-3 text-sm text-slate-100 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition font-sans" required>
                        <option value="" disabled selected>Selecciona un miembro...</option>
                        <option value="Miguel">Miguel (Dev Fullstack)</option>
                        <option value="Cristian">Cristian (UI/UX Design)</option>
                        <option value="Luis">Luis (AI Engineer)</option>
                    </select>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-[10px] font-mono text-slate-400 mb-1 block">INICIO</label>
                        <input type="date" id="fechaInicio" class="w-full bg-[#070a11] border border-slate-800 rounded-xl p-2.5 text-xs text-slate-200 font-mono focus:outline-none focus:border-indigo-500" required>
                    </div>
                    <div>
                        <label class="text-[10px] font-mono text-slate-400 mb-1 block">FIN ESTIMADO</label>
                        <input type="date" id="fechaFin" class="w-full bg-[#070a11] border border-slate-800 rounded-xl p-2.5 text-xs text-slate-200 font-mono focus:outline-none focus:border-indigo-500" required>
                    </div>
                </div>
                
                <div>
                    <label class="text-[11px] font-mono text-slate-400 mb-1 block">URL ENTREGABLE / GITHUB</label>
                    <input type="url" id="url" placeholder="https://..." class="w-full bg-[#070a11] border border-slate-800 rounded-xl p-3 text-sm text-slate-100 focus:outline-none focus:border-indigo-500 font-sans">
                </div>
                
                <div class="flex justify-end gap-3 mt-6 pt-4 border-t border-slate-800">
                    <button type="button" onclick="document.getElementById('taskModal').classList.add('hidden')" class="px-4 py-2 text-xs font-mono text-slate-400 hover:text-white transition">CANCELAR</button>
                    <button type="submit" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-mono font-bold rounded-xl shadow-[0_0_15px_rgba(99,102,241,0.4)] transition">GUARDAR_TAREA</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
