<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablero Kanban - LCM visuals</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; }
        .kanban-column { min-height: 60vh; }
        .card.dragging { opacity: 0.5; transform: scale(0.95); }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 h-screen flex flex-col overflow-x-hidden">

    <!-- Header -->
    <header class="bg-indigo-600 text-white p-4 shadow-md flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-bold">Tablero Kanban - LCM visuals</h1>
            <p class="text-sm text-indigo-200">Gestión de Tareas y Entregables</p>
        </div>
        <button onclick="document.getElementById('taskModal').classList.remove('hidden')" class="bg-white text-indigo-600 px-4 py-2 rounded-md font-semibold hover:bg-indigo-50 transition">
            + Nueva Tarjeta
        </button>
    </header>

    <!-- Tablero Kanban -->
    <main class="flex-1 overflow-x-auto p-6">
        <div class="flex gap-6 items-start h-full" id="board">
            
            <!-- Columnas -->
            <div class="bg-gray-200 rounded-lg w-80 shrink-0 p-4 flex flex-col" data-status="Backlog">
                <h2 class="font-semibold text-gray-700 mb-4 flex items-center gap-2">📌 Backlog</h2>
                <div class="kanban-column space-y-3" id="col-Backlog"></div>
            </div>

            <div class="bg-gray-200 rounded-lg w-80 shrink-0 p-4 flex flex-col" data-status="Asignado a">
                <h2 class="font-semibold text-gray-700 mb-4 flex items-center gap-2">👤 Asignado a</h2>
                <div class="kanban-column space-y-3" id="col-Asignado a"></div>
            </div>

            <div class="bg-blue-100 rounded-lg w-80 shrink-0 p-4 flex flex-col" data-status="En progreso">
                <h2 class="font-semibold text-blue-700 mb-4 flex items-center gap-2">⚙️ En progreso</h2>
                <div class="kanban-column space-y-3" id="col-En progreso"></div>
            </div>

            <div class="bg-yellow-100 rounded-lg w-80 shrink-0 p-4 flex flex-col" data-status="En revisión">
                <h2 class="font-semibold text-yellow-700 mb-4 flex items-center gap-2">👀 En revisión</h2>
                <div class="kanban-column space-y-3" id="col-En revisión"></div>
            </div>

            <div class="bg-green-100 rounded-lg w-80 shrink-0 p-4 flex flex-col" data-status="Finalizado">
                <h2 class="font-semibold text-green-700 mb-4 flex items-center gap-2">✅ Finalizado</h2>
                <div class="kanban-column space-y-3" id="col-Finalizado"></div>
            </div>

        </div>
    </main>

    <!-- Modal para Nueva Tarjeta -->
    <div id="taskModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center">
        <div class="bg-white rounded-lg p-6 w-full max-w-md">
            <h2 class="text-xl font-bold mb-4">Crear Nueva Tarjeta</h2>
            <form id="taskForm" class="space-y-3">
                <input type="text" id="titulo" placeholder="Título de la tarea" class="w-full border rounded p-2" required>
                <textarea id="descripcion" placeholder="Descripción detallada..." class="w-full border rounded p-2 h-24" required></textarea>
                
                <select id="responsable" class="w-full border rounded p-2" required>
                    <option value="" disabled selected>Asignar a...</option>
                    <option value="Carlos">Carlos (Dev)</option>
                    <option value="Maria">Maria (Design)</option>
                    <option value="Miguel">Miguel (AI Prompter)</option>
                </select>

                <div class="flex gap-2">
                    <div class="w-1/2">
                        <label class="text-xs text-gray-500">Fecha Inicio</label>
                        <input type="date" id="fechaInicio" class="w-full border rounded p-2" required>
                    </div>
                    <div class="w-1/2">
                        <label class="text-xs text-gray-500">Fecha Fin</label>
                        <input type="date" id="fechaFin" class="w-full border rounded p-2" required>
                    </div>
                </div>
                
                <input type="url" id="url" placeholder="URL de referencia (Opcional)" class="w-full border rounded p-2">
                
                <div class="flex justify-end gap-2 mt-4">
                    <button type="button" onclick="document.getElementById('taskModal').classList.add('hidden')" class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded">Cancelar</button>
                    <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded hover:bg-indigo-700">Crear Tarjeta</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
